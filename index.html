<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>undisciplined · prólogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,200;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#E2DFD9; --bg2:#D7D3CC; --ink:#23221F; --soft:#6E6A63; --faint:rgba(35,34,31,.14);
  --halo:#7C786F; --dust:#3a3833; --grain:.45; --blend:multiply; --vig:rgba(120,114,104,.32);
  --serif:"Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171716; --bg2:#1F1E1C; --ink:#D8D4CC; --soft:#8D8981; --faint:rgba(216,212,204,.12);
    --halo:#CFC9BE; --dust:#E8E3D9; --grain:.34; --blend:screen; --vig:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171716; --bg2:#1F1E1C; --ink:#D8D4CC; --soft:#8D8981; --faint:rgba(216,212,204,.12);
  --halo:#CFC9BE; --dust:#E8E3D9; --grain:.34; --blend:screen; --vig:rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-weight:300;font-size:1.125rem;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
em,i{font-style:normal}
[data-k] i,[data-k] em{font-style:italic}
[data-k] b,[data-k] strong{font-weight:500}
[data-k] s{text-decoration-thickness:1px}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

body::after{content:"";position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.05' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;animation:grain .9s steps(5) infinite}
.vignette{position:fixed;inset:0;z-index:85;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,var(--vig) 100%)}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-3%)}75%{transform:translate(-2%,-4%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){body::after,.breath{animation:none!important}}

.wrap{width:min(1080px,100% - 3rem);margin-inline:auto}
@media (min-width:1400px){.wrap{width:min(1240px,100% - 6rem)}body{font-size:1.2rem}.corpo{max-width:740px}}
.small{font-family:var(--sans);font-weight:300;font-size:.82rem;letter-spacing:.03em;color:var(--soft)}

/* fundo ruidoso */
main{position:relative;z-index:1}
.fundo{position:fixed;inset:0;z-index:0;pointer-events:none}
.fundo canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.8s ease}
.fundo canvas.on{opacity:1}
@media (prefers-reduced-motion:reduce){.fundo canvas{transition:none}}

/* barra */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg);opacity:0;transition:opacity .4s}
body.lendo::before{opacity:.92}
.barra{position:fixed;top:0;left:0;right:0;z-index:70;padding-top:env(safe-area-inset-top,0px);transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
body.lendo .barra{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:var(--faint)}
.barra .in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:60px}
.marca{font-family:var(--serif);font-weight:300;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.onde{font-family:var(--sans);font-weight:300;font-size:.85rem;color:var(--soft);opacity:0;transition:opacity .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
body.lendo .onde{opacity:1}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:42px;padding:0 1.1rem;border:1px solid var(--faint);border-radius:999px;background:transparent;cursor:pointer;font-family:var(--sans);font-weight:400;font-size:.88rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.prog{position:absolute;left:0;bottom:-1px;height:1px;background:var(--ink);width:0}
@media (max-width:640px){.onde{display:none}}

/* abertura */
.hero{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden}
.sky{position:absolute;inset:0;width:100%;height:100%}
.sky circle.s{fill:var(--dust)}
.halo-wide{fill:none;stroke:var(--halo);mix-blend-mode:var(--blend)}
.breath{animation:breath 12s ease-in-out infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes breath{50%{opacity:.75;transform:scale(1.04)}}
.hero-text{position:absolute;left:0;right:0;bottom:clamp(2.5rem,8vh,5rem)}
.hero h1{font-family:var(--serif);font-weight:200;font-size:clamp(3rem,10vw,7.5rem);letter-spacing:-.035em;line-height:1;margin:0}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-top:1rem}

/* abertura textual */
.prologo{padding:clamp(5rem,12vw,9rem) 0}
.prologo p{font-size:clamp(1.5rem,3.2vw,2.3rem);font-weight:200;line-height:1.3;max-width:28ch;margin:0 0 1.5rem}
.prologo .small{max-width:52ch;font-size:.95rem;line-height:1.7}

/* capítulos */
.cap{padding:0 0 clamp(5rem,12vw,9rem)}
.ilu{margin:0 0 clamp(2.5rem,6vw,4rem)}
.ilu canvas{display:block;width:100%;height:clamp(300px,58vh,620px)}
.ilu figcaption{width:min(1080px,100% - 3rem);margin:.8rem auto 0;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.cap-grid{display:grid;grid-template-columns:140px 1fr;gap:clamp(1rem,4vw,3rem)}
.num{font-family:var(--sans);font-weight:300;font-size:.9rem;color:var(--soft);letter-spacing:.06em;padding-top:.9rem}
.num b{display:block;font-family:var(--serif);font-weight:200;font-size:clamp(3rem,7vw,5rem);line-height:1;color:var(--ink);letter-spacing:-.03em;margin-bottom:.4rem}
.corpo{max-width:680px}
.cap h2{font-family:var(--serif);font-weight:200;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.015em;margin:0 0 1.4rem}
.frase{font-size:clamp(1.35rem,2.6vw,1.75rem);line-height:1.35;font-weight:300;margin:0 0 2rem}
.olho{margin:0 0 2rem;padding:1.4rem 0 1.4rem 1.6rem;border-left:1px solid var(--ink)}
.olho p{font-size:1.2rem;line-height:1.5;margin:0}
.olho cite{display:block;margin-top:.6rem;font-style:normal}
.corpo>p,.mais>p{margin:0 0 1.1rem}
.acoes{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.mais{margin-top:1.4rem}
.mais h3{font-family:var(--serif);font-weight:300;font-size:1.45rem;margin:2rem 0 .6rem}
details.sub{border-top:1px solid var(--faint)}
details.sub:last-of-type{border-bottom:1px solid var(--faint)}
details.sub summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr 20px;gap:1rem;align-items:center;padding:1.1rem 0;font-size:1.3rem;font-weight:300}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary svg.g{width:44px;height:44px}
details.sub summary .plus{font-family:var(--sans);color:var(--soft);transition:transform .3s;text-align:right}
details.sub[open] summary .plus{transform:rotate(45deg)}
details.sub .txt{padding:0 0 1.4rem calc(44px + 1rem);color:var(--soft);font-size:1.02rem}
details.sub .txt p{margin:0 0 .8rem}
.subs{margin-top:1.5rem}

/* configurações */
.configs{display:flex;flex-wrap:wrap;gap:.2rem 1.5rem;margin:2.5rem 0 2rem;border-bottom:1px solid var(--faint)}
.configs button{background:none;border:0;padding:.5rem 0 .8rem;cursor:pointer;font-family:var(--serif);font-weight:300;font-size:1.2rem;color:var(--soft);border-bottom:1px solid transparent;margin-bottom:-1px}
.configs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.orbit-wrap{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:clamp(1.5rem,4vw,3rem);align-items:start}
.orbit{width:100%;transition:opacity .5s}
.orbit .arc{fill:none;transition:opacity .4s}
.orbit .arc.dim{opacity:.12}
.orbit text{font-family:var(--sans);font-size:10px;fill:var(--soft)}
.cfg{transition:opacity .5s}
.cfg h3{font-family:var(--serif);font-weight:200;font-size:2rem;margin:0 0 .8rem}
.cfg p{font-size:1rem;margin:0 0 .8rem}
.seq{list-style:none;padding:0;margin:1.2rem 0 0;border-top:1px solid var(--faint)}
.seq li{padding:.45rem 0;border-bottom:1px solid var(--faint);font-size:.98rem}
.seq li.off{color:var(--soft)}
.fade{opacity:0}

/* constantes */
.const{list-style:none;padding:0;margin:1.5rem 0 0}
.const li{font-size:clamp(1.2rem,2.3vw,1.5rem);font-weight:200;line-height:1.35;padding:1.1rem 0;border-top:1px solid var(--faint)}

/* pessoas */
.temporada{list-style:none;padding:0;margin:2rem 0 0;display:grid;gap:0}
.temporada li{display:grid;grid-template-columns:88px 1fr;gap:1.2rem;align-items:center;padding:1.2rem 0;border-top:1px solid var(--faint)}
.temporada canvas{width:88px;height:88px;border-radius:50%}
.temporada h4{font-family:var(--serif);font-weight:300;font-size:1.35rem;margin:0}
.temporada p{margin:.15rem 0 0;font-size:.98rem;color:var(--soft)}

/* painel lateral */
.veu{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .35s}
.veu.on{opacity:1;pointer-events:auto}
.painel{position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(460px,100%);background:var(--bg2);transform:translateX(100%);transition:transform .45s cubic-bezier(.6,.1,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.painel.on{transform:none}
.painel header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--faint)}
.painel header h2{font-family:var(--serif);font-weight:300;font-size:1.3rem;margin:0}
.painel .conteudo{overflow-y:auto;padding:1rem 1.5rem 3rem;flex:1}
.refs{list-style:none;padding:0;margin:0}
.refs li{padding:1.1rem 0;border-bottom:1px solid var(--faint)}
.refs .t{font-size:1.15rem;line-height:1.3}
.refs .a{margin:.2rem 0 .4rem}
.refs .w{font-size:.98rem;color:var(--soft);margin:0}
.indice{list-style:none;padding:0;margin:0}
.indice a{display:grid;grid-template-columns:3rem 1fr;gap:.5rem;padding:1rem 0;border-bottom:1px solid var(--faint);text-decoration:none;color:var(--ink);font-size:1.25rem;font-weight:300}
.indice a span{font-family:var(--sans);font-size:.85rem;color:var(--soft);padding-top:.3rem}

footer{padding:4rem 0 6rem;border-top:1px solid var(--faint)}
footer p.close{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:200;line-height:1.25;max-width:26ch;margin:0 0 2.5rem}

@media (max-width:820px){
  .cap-grid{grid-template-columns:1fr;gap:.5rem}
  .num{padding-top:0}
  .num b{font-size:2.6rem;display:inline;margin-right:.6rem}
  .orbit-wrap{grid-template-columns:1fr}
  .orbit{max-width:320px;justify-self:center}
}

/* eixos */
.eixos{display:grid;grid-template-columns:1fr minmax(0,420px);gap:clamp(2rem,6vw,5rem);align-items:center;margin-top:clamp(3rem,8vw,5rem)}
.eixos dl{margin:0}
.eixos dt{font-family:var(--sans);font-weight:400;font-size:.85rem;letter-spacing:.04em;color:var(--soft);margin-top:1.6rem}
.eixos dd{margin:.3rem 0 0;font-size:1.05rem}
.eixos dt.cruz{color:var(--ink)}
.eixos dd.cruz{font-size:1.2rem}
.eixos svg{width:100%}
.eixos svg text{font-family:var(--sans);font-size:11px;fill:var(--soft);letter-spacing:.06em}
.prologo .colheita{font-size:clamp(1.2rem,2.2vw,1.5rem);font-weight:200;line-height:1.4;max-width:40ch;margin:clamp(3rem,7vw,4.5rem) 0 2rem;padding-top:2rem;border-top:1px solid var(--faint)}
.linhas{list-style:none;padding:0;margin:2rem 0 0}
.linhas li{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;padding:1.4rem 0;border-top:1px solid var(--faint)}
.linhas .r{font-family:var(--serif);font-weight:200;font-size:1.8rem;line-height:1;color:var(--soft)}
.linhas .q{display:block;margin-bottom:.2rem}
.linhas h4{font-family:var(--serif);font-weight:300;font-size:1.45rem;margin:0}
.linhas p{margin:.3rem 0 0;font-size:1rem;color:var(--soft)}
@media (max-width:820px){.eixos{grid-template-columns:1fr}.eixos svg{max-width:340px;justify-self:center;order:-1}}

.prologo p.porque{font-size:clamp(1.15rem,2vw,1.35rem);font-weight:300;line-height:1.6;max-width:46ch;color:var(--soft);margin-top:2rem}

/* ensaio do prólogo */
.prologo h2.titulo-pro{font-family:var(--serif);font-weight:200;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 clamp(2.5rem,6vw,4rem)}
.prologo .ensaio p{font-size:clamp(1.12rem,1.6vw,1.3rem);font-weight:300;line-height:1.75;max-width:60ch;margin:0 0 1.6rem}
.prologo .eixos{margin:clamp(2rem,5vw,3.5rem) 0}
.prologo .eixos .ensaio p{margin:0}
.prologo p.nome{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:200;line-height:1.3;max-width:30ch;margin:clamp(3rem,7vw,5rem) 0 0;padding-top:2rem;border-top:1px solid var(--faint)}

/* quasar */
.quasar{position:relative;height:260vh;width:100vw;margin-left:calc(50% - 50vw);margin-block:clamp(1rem,4vw,3rem)}
.qz-sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#qzCanvas{display:block;width:100%;height:100%}
.qz-leg{position:absolute;left:1.5rem;right:1.5rem;bottom:calc(env(safe-area-inset-bottom,0px) + 2rem);text-align:center;max-width:52ch;margin:0 auto}
@media (prefers-reduced-motion:reduce){.quasar{height:auto}.qz-sticky{position:relative;height:80vh}}

/* ilustrações ocultas por enquanto (para reincluir, apagar este bloco) */
.ilu,.temporada canvas{display:none!important}
.cap{padding-top:clamp(4rem,10vw,7rem);border-top:1px solid var(--faint)}
.temporada li{grid-template-columns:1fr}

.quebra{border:0;border-top:1px solid var(--faint);margin:clamp(3rem,7vw,5rem) 0;max-width:60ch}

/* pássaros e vales */
.vales{margin:0 0 clamp(3rem,7vw,5rem)}
.vales canvas{display:block;width:100%;height:clamp(380px,70vh,720px)}
.vales figcaption{margin-top:1rem}
.vales figcaption span{max-width:60ch;display:block}

/* ilustrações vivas */
#halo{display:none}
#haloCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.viva{margin:0 0 clamp(2.5rem,6vw,4rem)}
.viva canvas{display:block;width:100%;height:clamp(340px,62vh,640px)}
.viva figcaption{width:min(1080px,100% - 3rem);margin:.8rem auto 0}

.viva canvas{touch-action:pan-y}
body.editando .viva canvas{touch-action:none}
.viva canvas.arrastando{cursor:grabbing!important}
.kbtns{display:none;width:min(1080px,100% - 3rem);margin:.8rem auto 0;gap:.5rem;align-items:center;flex-wrap:wrap}
.kbtns .small{flex:1 1 220px}
body.editando .kbtns{display:flex}

.prologo p.autor{margin:0 0 clamp(2rem,5vw,3rem);font-size:.82rem;letter-spacing:.03em}
.bloco{margin-top:clamp(2.5rem,6vw,4rem)}
.bloco>h3{font-family:var(--serif);font-weight:300;font-size:1.6rem;margin:0 0 .6rem}
.viva-in{margin:1.5rem 0}
.viva-in figcaption{width:auto;margin:.6rem 0 0}

.aprof-pro{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin:2.5rem 0 0}
.aprof-pro p{margin:0;max-width:48ch}
.cap .seg+.seg{margin-top:2rem}
.sole canvas{height:clamp(320px,58vh,580px)}
.viva.sole{margin:clamp(2.5rem,6vw,4rem) 0}
.itens-insp{list-style:none;padding:0;margin:1rem 0 0}
.itens-insp li{font-size:clamp(1.3rem,2.4vw,1.6rem);font-weight:200;padding:.8rem 0;border-top:1px solid var(--faint)}
footer p.fonte{margin:-1.5rem 0 2rem}
footer .assin{margin-top:2rem}

/* layout contínuo */
.cap{padding:clamp(1.5rem,4vw,2.5rem) 0 clamp(2rem,5vw,3rem)!important;border-top:0!important}
.prologo{padding-bottom:clamp(1.5rem,4vw,2.5rem)}
.cap-grid{grid-template-columns:1fr!important;gap:0!important}
.cap-grid .num{display:none}
.corpo{max-width:680px}
.viva,.vales{width:min(1080px,100% - 3rem);margin-inline:auto}
.viva figcaption{width:auto!important;margin:.8rem 0 0!important}
.vales figcaption{width:auto;padding:0}
.viva.sole{margin:clamp(1.5rem,4vw,2.5rem) auto}
.prologo .aprof-pro{margin-top:2rem}
footer{border-top:0}
body.ver-insp .hero,body.ver-insp .prologo,body.ver-insp #capitulos,body.ver-insp footer{display:none}
#paginaInsp{padding-top:calc(env(safe-area-inset-top,0px) + 5rem);min-height:90vh}
.insp-topo{margin-bottom:1rem}
.insp-pag{padding-top:clamp(2rem,5vw,3rem)!important}
.insp-pag .voltar{display:none}
.insp-pag h2{font-family:var(--serif);font-weight:200;font-size:clamp(2.2rem,5vw,3.4rem);margin:0 0 1.4rem}

.cap .corpo>p,.insp-pag .wrap>p:not(.small){font-size:clamp(1.12rem,1.6vw,1.3rem);font-weight:300;line-height:1.75;max-width:60ch;margin:0 0 1.6rem}

#soleCv{cursor:grab;touch-action:pan-y}
#soleCv.arrastando{cursor:grabbing}
.dica-sole{display:block;text-align:right;margin-top:.4rem}

@media (max-width:700px){body::after{animation:none}}

/* versão para compartilhar */
footer{padding-bottom:0!important}
.vales{width:100%!important;max-width:none!important;margin:3rem 0 0!important}
.vales figcaption{display:none}
footer p.close:empty{display:none}
footer p.fonte{margin:0 0 1rem!important;font-style:italic}
#editar{display:none!important}

#tema{display:none!important}

/* glitch */
.glitch{position:relative;display:inline-block;animation:gl0 3.6s infinite steps(1)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;white-space:nowrap}
.glitch::before{text-shadow:-1px 0 rgba(168,182,203,.6);animation:gl1 3.6s infinite steps(1);animation-delay:inherit}
.glitch::after{text-shadow:1px 0 rgba(201,182,166,.6);animation:gl2 3.6s infinite steps(1);animation-delay:inherit}
@keyframes gl0{0%,66%,96%,100%{transform:none}68%{transform:skewX(-1.5deg)}82%{transform:translateX(.5px)}}
@keyframes gl1{0%,66%,98%,100%{opacity:0;transform:none;clip-path:none}68%{opacity:.4;clip-path:inset(10% 0 60% 0);transform:translateX(-1px)}78%{opacity:.35;clip-path:inset(60% 0 8% 0);transform:translateX(1px)}88%{opacity:.25;clip-path:inset(36% 0 42% 0);transform:translateX(-.5px)}}

<script type="application/json" id="dados">{"hero":{"sub":"Programa de educação continuada · Kunumi lectures"},"prologo":{"p":"Reaprender a aprender","ps":["Durante muito tempo, conhecer o mundo era visto como forma de conhecer também a si mesmo. Investigar a natureza era um exercício de transformação. O saber era visto como caminho, como forma de devir.","Em um determinado momento, no entanto, passamos a separar o que unia conhecer e se transformar. Depois, os próprios saberes se fragmentaram. Passamos a viver a sistematização do conhecimento como verdade, tomando como realidade o que surgiu para organizar informação.","Aprendemos a valorizar algumas formas de saber mais que outras. O objetivo mais que o subjetivo, o racional mais que o sensível. Aprendemos a medir o conhecimento pelo que ele produz, e quase nunca pelo sentido.","Como indisciplinados, desafiamos a separação do conhecimento, suas fronteiras e as formas de ensinar, e relembramos o processo de transformação inerente ao ato de conhecer. Somos parte do que investigamos. Aprendemos sobre o cosmos olhando para dentro, e sobre nós mesmos olhando para fora."],"nome":"","qleg":"Um quasar. As duas formas de desenvolvimento chegam de lados diferentes, se encontram no centro, onde a luz é mais intensa, e seguem adiante.","autor":"","aprofnota":"Na Kunumi: o movimento do conhecimento, as duas direções de desenvolvimento e as inspirações por trás do programa.","sleg":"Despertar, investigar, criar, compartilhar, reconhecer. A cada volta, um novo despertar."},"fim":{"frase":"","assinatura":"LC 11.2026","passaros":"Trinta pássaros atravessam sete vales em busca do Simurgh e descobrem, ao chegar, que eram eles mesmos o que buscavam. A partir de A conferência dos pássaros, de Attar.","fonte":"Em construção: o programa, primeira temporada, outras temporadas"},"gestos":{"limiar":{"n":"Limiar","d":"Entrar no tema pela experiência: um fenômeno, um objeto, uma imagem, um gesto. Antes do conceito, ninguém é especialista."},"pergunta":{"n":"Pergunta","d":"Alguém nomeia o que ainda não sabe. Pode vir do convidado ou do grupo."},"exposicao":{"n":"Exposição","d":"O centro. Um pensamento longo, com seu caminho e suas dúvidas, oferecido por quem pensou a fundo. É a única parte gravada."},"traducao":{"n":"Tradução","d":"A ideia atravessa outra linguagem: a metáfora de outra disciplina, um diagrama, um objeto, o corpo, o código. Ou encontra um projeto real."},"roda":{"n":"Roda","d":"O que foi feito é mostrado. O convidado também é afetado, e o host nomeia as pontes entre o que apareceu."},"silencio":{"n":"Silêncio","d":"Um tempo sem fala para que algo assente. Pode ser pausa, escuta, caminhada, escrita livre."},"colheita":{"n":"Colheita","d":"Duas perguntas: o que isso ilumina no que eu faço? O que isso mudou em mim? O convidado também responde."}},"configs":[{"n":"Eclipse","d":"A exposição ocupa quase todo o céu. A experiência aparece só na borda, como um anel de luz, mas é ela que dá contorno ao centro.","w":"Quando o convidado traz um pensamento longo e denso, que pede continuidade.","s":[["limiar",10],["exposicao",90],["silencio",5],["roda",25],["colheita",10]]},{"n":"Órbita","d":"O pensamento se abre em camadas. Exposição e tradução se alternam, e cada volta chega mais perto do centro.","w":"Para temas que se constroem por partes e ganham com pausas para serem experimentados.","s":[["pergunta",10],["exposicao",30],["traducao",20],["silencio",5],["exposicao",35],["roda",25],["colheita",10]]},{"n":"Refração","d":"Uma ideia curta atravessa muitas linguagens, como luz num prisma. O centro é breve; o espectro é o encontro.","w":"Quando o propósito é integrar disciplinas e ver uma mesma essência em formas diferentes.","s":[["pergunta",10],["exposicao",25],["traducao",60],["roda",35],["colheita",10]]},{"n":"Noite","d":"Começa sem explicação. O grupo vive algo longamente, conversa sobre o que viveu, e só então o conceito chega, como resposta a uma pergunta que já existe.","w":"Para temas de percepção, estética e experiência, em que nomear cedo demais empobrece.","s":[["silencio",10],["limiar",40],["roda",30],["exposicao",50],["colheita",10]]},{"n":"Inversão","d":"A plateia ocupa o centro. Os grupos constroem e mostram; o convidado escuta, e sua exposição vem por último, em resposta ao que recebeu.","w":"Para o fim de um ciclo, quando o grupo já tem repertório para devolver.","s":[["limiar",10],["pergunta",10],["traducao",50],["roda",50],["exposicao",20],["colheita",10]]}],"caps":[]}</script>

    if(ch.linhas) fixo+=`<ul class="linhas">${ch.linhas.map((l,j)=>`<li><span class="r">${['I','II','III','IV','V'][j]||j+1}</span><div>${T(`${K}.linhas.${j}.q`,'span','small q')}${T(`${K}.linhas.${j}.n`,'h4')}${T(`${K}.linhas.${j}.d`,'p')}</div></li>`).join('')}</ul>`;
    if(ch.pessoas) fixo+=`<ul class="temporada">${ch.pessoas.map((p,j)=>`<li><canvas data-ilu="retrato" data-seed="${40+j*7}" data-dense="1.6" aria-hidden="true"></canvas><div>${T(`${K}.pessoas.${j}.n`,'h4')}${T(`${K}.pessoas.${j}.d`,'p')}</div></li>`).join('')}</ul>`;
    s.innerHTML=(ch.ilu?`<figure class="ilu"><canvas data-ilu="${ch.ilu}" data-seed="${ch.seed}" data-dense="${ch.dense||1}" role="img" aria-label="${esc(strip(ch.leg))}"></canvas><figcaption>${T(K+'.leg','span','small')}<span class="small">Ilustração gerada</span></figcaption></figure>`:'')+`
      <div class="wrap cap-grid">
        <div class="num"><b>${n}</b>${esc(strip(ch.titulo))}</div>
        <div class="corpo">
          ${T(K+'.titulo','h2')}
          ${ch.frase!=null?T(K+'.frase','p','frase'):''}
          ${ch.olho!=null?`<blockquote class="olho">${T(K+'.olho','p')}${(ch.aut||'')?T(K+'.aut','cite','small'):''}</blockquote>`:''}
          ${ch.lead!=null?T(K+'.lead','p'):''}
          ${ch.ps?ch.ps.map((p,j)=>T(`${K}.ps.${j}`,'p')).join(''):''}
          ${ch.itens?`<ul class="itens-insp">${ch.itens.map((p,j)=>T(`${K}.itens.${j}`,'li')).join('')}</ul>`:''}
          ${fixo}
          ${mais?`<div class="mais" id="mais-${ch.id}" hidden>${mais}</div>`:''}
          <div class="acoes">
            ${mais?`<button class="btn ler" type="button" aria-expanded="false" aria-controls="mais-${ch.id}">Ler mais</button>`:''}
            ${ch.refs?`<button class="btn aprof" type="button" data-i="${i}">Aprofundar</button>`:''}
          </div>
        </div>
      </div>`;
    root.appendChild(s);
  });
  document.querySelectorAll('canvas[data-ilu]').forEach(watch);
  document.querySelectorAll('.ler').forEach(b=>b.addEventListener('click',()=>{
    const m=$(b.getAttribute('aria-controls')), open=b.getAttribute('aria-expanded')==='true';
    m.hidden=open; b.setAttribute('aria-expanded',!open); b.textContent=open?'Ler mais':'Ler menos';
  }));

  /* ---------- glitch ---------- */
  function glitchify(root){
    const re=/[Ii]ndisciplinad[oa]s?/g;
    root.querySelectorAll('[data-k]').forEach(el=>{
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), nodes=[];
      while(w.nextNode()){const n=w.currentNode; re.lastIndex=0; if(re.test(n.nodeValue)&&!n.parentElement.closest('.glitch'))nodes.push(n)}
      nodes.forEach(n=>{
        const frag=document.createDocumentFragment(), t=n.nodeValue; let last=0; re.lastIndex=0; let m;
        while((m=re.exec(t))){
          if(m.index>last)frag.appendChild(document.createTextNode(t.slice(last,m.index)));
          const sp=document.createElement('span'); sp.className='glitch'; sp.dataset.t=m[0]; sp.textContent=m[0];
          sp.style.animationDelay=(-Math.random()*3.6).toFixed(2)+'s'; frag.appendChild(sp); last=m.index+m[0].length;
        }
        if(last<t.length)frag.appendChild(document.createTextNode(t.slice(last)));
        n.replaceWith(frag);
      });
    });
  }
  function desglitch(){document.querySelectorAll('.glitch').forEach(g=>{const p=g.parentNode;g.replaceWith(document.createTextNode(g.textContent));p.normalize()})}


  /* ---------- painel ---------- */
  const painel=$('painel'),veu=$('veu');let lastFocus=null;
  function abrir(titulo,html){lastFocus=document.activeElement;$('painelTitulo').textContent=titulo;$('painelConteudo').innerHTML=html;
    painel.classList.add('on');veu.classList.add('on');painel.setAttribute('aria-hidden','false');if(editando)marca($('painelConteudo'));$('fechar').focus()}
  function fechar(){painel.classList.remove('on');veu.classList.remove('on');painel.setAttribute('aria-hidden','true');if(lastFocus)lastFocus.focus()}
  $('fechar').addEventListener('click',fechar);veu.addEventListener('click',fechar);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&painel.classList.contains('on'))fechar()});
  document.querySelectorAll('.aprof').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i, ch=D.caps[i];
    abrir('Aprofundar · '+strip(ch.titulo),`<ul class="refs">${ch.refs.map((r,j)=>`<li>${T(`caps.${i}.refs.${j}.t`,'div','t')}${T(`caps.${i}.refs.${j}.a`,'div','small a')}${T(`caps.${i}.refs.${j}.w`,'p','w')}</li>`).join('')}</ul>`);
  }));
  $('abrirIndice').addEventListener('click',()=>{
    abrir('Índice',`<ul class="indice"><li><a href="#prologo"><span>—</span>Prólogo</a></li>${D.caps.map((c,i)=>`<li><a href="#${c.id}"><span>${String(i+1).padStart(2,'0')}</span>${esc(strip(c.titulo))}</a></li>`).join('')}</ul>`);
    $('painelConteudo').querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{painel.classList.remove('on');veu.classList.remove('on');painel.setAttribute('aria-hidden','true')}));
  });

  /* ---------- barra ---------- */
  const onde=$('onde'),prog=$('prog');
  function onScroll(){
    document.body.classList.toggle('lendo',scrollY>innerHeight*.7);
    const max=document.documentElement.scrollHeight-innerHeight; prog.style.width=(max>0?scrollY/max*100:0)+'%';
    let cur=null; document.querySelectorAll('.cap').forEach(s=>{if(s.offsetParent&&s.getBoundingClientRect().top<innerHeight*.4)cur=s});
    onde.textContent=cur?`${cur.dataset.n} · ${cur.dataset.t}`:'';
    setFundo(cur?+cur.dataset.n:(scrollY>innerHeight*.5?9:0));
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  function rota(){const v=['#aprofundar','#inspiracoes','#na-kunumi'].includes(location.hash);document.body.classList.toggle('ver-insp',v);$('paginaInsp').hidden=!v;if(v)scrollTo(0,0);else if(location.hash==='#prologo'){const p=$('prologo');if(p)p.scrollIntoView()}}
  addEventListener('hashchange',rota); rota();

  /* ---------- configurações ---------- */
  const tabs=$('configs'),orbit=$('orbit'),cfg=$('cfg');
  if(tabs){
  const R=150,C=200,gap=1.6; let cfgAtual=0;
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return[C+Math.cos(a)*r,C+Math.sin(a)*r]};
  const arc=(a0,a1,r)=>{const[x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`};
  function draw(i){
    cfgAtual=i;
    const c=D.configs[i],tot=c.s.reduce((a,b)=>a+b[1],0),expo=c.s.filter(x=>x[0]==='exposicao').reduce((a,b)=>a+b[1],0);
    let svg=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--faint)"/><circle cx="${C}" cy="${C}" r="${18+expo*.9}" fill="var(--halo)" opacity=".12" filter="url(#soft)"/><circle cx="${C}" cy="${C}" r="${2+expo/30}" fill="var(--ink)"/>`;
    let t=0;
    c.s.forEach(([k,m],j)=>{const a0=t/tot*360+gap/2,a1=(t+m)/tot*360-gap/2,st=GF[k].st;
      svg+=`<path class="arc" data-j="${j}" d="${arc(a0,a1,R)}" stroke="${st.iris?'url(#iris)':'var(--ink)'}" stroke-width="${st.w}" opacity="${st.o}" ${st.dash?`stroke-dasharray="${st.dash}" stroke-linecap="round"`:''} filter="url(#film)"/>`;t+=m});
    const[tx,ty]=pt(0,R+20);
    svg+=`<line x1="${C}" y1="${C-R-9}" x2="${C}" y2="${C-R+9}" stroke="var(--soft)"/><text x="${tx}" y="${ty-4}" text-anchor="middle">início</text>`;
    orbit.innerHTML=svg;
    cfg.innerHTML=`${T(`configs.${i}.n`,'h3')}${T(`configs.${i}.d`,'p')}${T(`configs.${i}.w`,'p','small')}<ul class="seq">${c.s.map(([k],j)=>`<li data-j="${j}" tabindex="0">${esc(strip(D.gestos[k].n))}</li>`).join('')}</ul>`;
    if(editando)marca(cfg);
    cfg.querySelectorAll('li').forEach(li=>{
      const on=()=>{orbit.querySelectorAll('.arc').forEach(a=>a.classList.toggle('dim',a.dataset.j!==li.dataset.j));cfg.querySelectorAll('li').forEach(x=>x.classList.toggle('off',x!==li))};
      const off=()=>{orbit.querySelectorAll('.arc').forEach(a=>a.classList.remove('dim'));cfg.querySelectorAll('li').forEach(x=>x.classList.remove('off'))};
      li.addEventListener('mouseenter',on);li.addEventListener('focus',on);li.addEventListener('mouseleave',off);li.addEventListener('blur',off)});
  }
  function select(i){
    [...tabs.children].forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1});
    if(reduce){draw(i);return}
    orbit.classList.add('fade');cfg.classList.add('fade');
    setTimeout(()=>{draw(i);orbit.classList.remove('fade');cfg.classList.remove('fade')},300);
  }
  D.configs.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=strip(c.n);b.setAttribute('role','tab');
    b.setAttribute('aria-selected',i===0);b.tabIndex=i===0?0:-1;b.addEventListener('click',()=>select(i));
    b.addEventListener('keydown',e=>{const n=D.configs.length;if(e.key==='ArrowRight'){select((i+1)%n);tabs.children[(i+1)%n].focus()}if(e.key==='ArrowLeft'){select((i+n-1)%n);tabs.children[(i+n-1)%n].focus()}});
    tabs.appendChild(b)});
  draw(0);
  }

  /* ---------- edição ---------- */
  const pto=(()=>{const d=document.createElement('div');try{d.contentEditable='plaintext-only';return d.contentEditable==='plaintext-only'}catch(e){return false}})();
  function marca(el){el.querySelectorAll('[data-k]').forEach(x=>{x.contentEditable='true';x.spellcheck=true})}
  function entrar(){
    editando=true; desglitch(); document.body.classList.add('editando');
    document.querySelectorAll('.mais').forEach(m=>m.hidden=false);
    document.querySelectorAll('.ler').forEach(b=>{b.setAttribute('aria-expanded','true');b.textContent='Ler menos'});
    document.querySelectorAll('details.sub').forEach(d=>d.open=true);
    marca(document.body); $('editar').hidden=true;
  }
  document.addEventListener('input',e=>{
    const el=e.target.closest&&e.target.closest('[data-k]'); if(!editando||!el)return;
    const v=limpa(el.innerHTML); set(el.dataset.k,v); alterado=true;
    $('edMsg').textContent='Alterações ainda não salvas.';
    if(/^configs\.\d+\.n$/.test(el.dataset.k)) tabs.children[+el.dataset.k.split('.')[1]].textContent=strip(v);
  });
  document.addEventListener('keydown',e=>{
    const el=e.target.closest&&e.target.closest('[data-k]'); if(!editando||!el)return;
    if(e.key==='Enter'){e.preventDefault();if(!e.shiftKey)divide(el);return}
    if(e.key==='Backspace'&&junta(el)){e.preventDefault();return}
    if(e.key===' '&&el.closest('summary')){e.preventDefault();document.execCommand('insertText',false,' ')}
  });
  function lista(el){const m=(el.dataset.k||'').match(/^(.*)\.(\d+)$/);if(!m)return null;const arr=get(m[1]);if(!Array.isArray(arr)||typeof arr[+m[2]]!=='string')return null;return{pre:m[1],i:+m[2],arr}}
  function renumera(pre,de,delta){document.querySelectorAll('[data-k]').forEach(x=>{const mm=x.dataset.k.match(/^(.*)\.(\d+)$/);if(mm&&mm[1]===pre&&+mm[2]>=de)x.dataset.k=pre+'.'+(+mm[2]+delta)})}
  function partes(el){const sel=getSelection();if(!sel.rangeCount)return null;const r=sel.getRangeAt(0);if(!el.contains(r.startContainer))return null;
    const a=document.createRange();a.selectNodeContents(el);a.setEnd(r.startContainer,r.startOffset);const b=document.createRange();b.selectNodeContents(el);b.setStart(r.endContainer,r.endOffset);
    const da=document.createElement('div');da.appendChild(a.cloneContents());const db=document.createElement('div');db.appendChild(b.cloneContents());return[limpa(da.innerHTML),limpa(db.innerHTML),da.textContent.length]}
  function cursor(el,pos){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n,acc=0;const r=document.createRange();
    while((n=w.nextNode())){if(acc+n.nodeValue.length>=pos){r.setStart(n,pos-acc);break}acc+=n.nodeValue.length}
    if(!n){r.selectNodeContents(el);r.collapse(false)}else r.collapse(true);const s2=getSelection();s2.removeAllRanges();s2.addRange(r)}
  function divide(el){const L=lista(el),p=partes(el);if(!L||!p)return;
    L.arr.splice(L.i,1,p[0],p[1]);renumera(L.pre,L.i+1,1);
    el.innerHTML=rich(p[0]);const novo=document.createElement(el.tagName);novo.className=el.className;novo.dataset.k=L.pre+'.'+(L.i+1);novo.contentEditable='true';novo.spellcheck=true;novo.innerHTML=rich(p[1]);
    el.after(novo);novo.focus();cursor(novo,0);alterado=true;$('edMsg').textContent='Alterações ainda não salvas.'}
  function junta(el){const L=lista(el);if(!L||L.i===0)return false;const p=partes(el);if(!p||p[2]>0)return false;const sel=getSelection();if(sel.rangeCount&&!sel.getRangeAt(0).collapsed)return false;
    const ant=document.querySelector(`[data-k="${L.pre}.${L.i-1}"]`);if(!ant)return false;
    const pos=ant.textContent.length,junto=L.arr[L.i-1]+(L.arr[L.i-1]&&L.arr[L.i]?' ':'')+L.arr[L.i];L.arr.splice(L.i-1,2,junto);
    el.remove();renumera(L.pre,L.i+1,-1);ant.innerHTML=rich(junto);ant.focus();cursor(ant,pos);alterado=true;$('edMsg').textContent='Alterações ainda não salvas.';return true}
  document.addEventListener('click',e=>{if(editando&&e.target.closest('summary')&&e.target.closest('[data-k]'))e.preventDefault()},true);
  document.addEventListener('paste',e=>{
    const el=e.target.closest&&e.target.closest('[data-k]'); if(!editando||!el)return;
    e.preventDefault(); document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));
  });
  function documento(){
    const json=JSON.stringify(D).replace(/</g,'\\u003c');
    const S='script';
    return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n'+$('cabeca').textContent+'\n<style id="css">'+$('css').textContent+'</style>\n</head>\n<body>\n'
      +'<'+S+' type="application/json" id="dados">'+json+'</'+S+'>\n'
      +'<'+S+' type="text/plain" id="cabeca">'+$('cabeca').textContent+'</'+S+'>\n'
      +'<'+S+' id="app">'+$('app').textContent+'</'+S+'>\n</body>\n</html>\n';
  }
  let salvando=false;
  async function salvar(){
    if(!art||salvando)return;
    salvando=true;
    const b=$('edSalvar'); b.disabled=true; b.textContent='Salvando…'; $('edMsg').textContent='Publicando a nova versão…';
    try{ await art.publish(documento()); alterado=false; editando=false; $('edMsg').textContent='Salvo. A página vai recarregar com as alterações.'; setTimeout(()=>location.reload(),2500); }
    catch(err){
      const code=err&&err.code;
      if(code==='not_writer'||code==='not_granted'){$('edMsg').textContent='Esta visualização é só de leitura: você pode ver a página, mas não salvar alterações.';$('editar').remove();}
      else if(code==='conflict'){alterado=false;editando=false;$('edMsg').textContent='Alguém salvou uma versão mais nova; a página vai recarregar com ela.';setTimeout(()=>location.reload(),2500);}
      else if(code==='rate_limited'){$('edMsg').textContent='Muitas gravações seguidas. Espere um pouco e tente de novo.';}
      else{$('edMsg').textContent='Não foi possível salvar agora. Tente de novo em instantes.';}
      if(code!=='conflict'){b.disabled=false; b.textContent='Salvar'; salvando=false;}
    }
  }
  $('edSalvar').addEventListener('click',salvar);
  document.querySelectorAll('.fmt').forEach(b=>{
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',()=>{
      const sel=getSelection(); if(!sel.rangeCount)return;
      const node=sel.anchorNode, el=node&&(node.nodeType===1?node:node.parentElement).closest('[data-k]');
      if(!el){$('edMsg').textContent='Selecione um trecho de texto para formatar.';return}
      try{document.execCommand('styleWithCSS',false,false)}catch(e){}
      document.execCommand(b.dataset.cmd,false,null);
      el.dispatchEvent(new Event('input',{bubbles:true}));
    });
  });
  $('edCancelar').addEventListener('click',()=>{if(!alterado||confirm('Descartar as alterações não salvas?'))location.reload()});
  $('editar').addEventListener('click',entrar);
  addEventListener('beforeunload',e=>{if(editando&&alterado&&!salvando){e.preventDefault();e.returnValue=''}});
  (async()=>{
    try{
      if(!window.claude||!window.claude.use)return;
      art=await window.claude.use('artifact'); if(!art)return;
      let pode=null; try{const u=await window.claude.use('user'); if(u&&u.canEdit)pode=await u.canEdit();}catch(e){}
      if(pode===false)return;
      $('editar').hidden=false;
    }catch(e){}
  })();
})();
</script>
</body>
</html>
